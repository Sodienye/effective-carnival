<title>Cue — teleprompter for creators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EEF4;
    --surface: #FFFFFF;
    --ink: #16202E;
    --muted: #55627A;
    --line: #C3CDDA;
    --accent: #F2B84B;
    --accent-ink: #1B1405;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1623;
      --surface: #172033;
      --ink: #EDEFF3;
      --muted: #9AA6BA;
      --line: #2A364D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1623;
    --surface: #172033;
    --ink: #EDEFF3;
    --muted: #9AA6BA;
    --line: #2A364D;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Editor ---------- */
  .editor {
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .editor[hidden] { display: none; }
  .editor h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; }
  .editor .sub { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
  #script {
    flex: 1;
    min-height: 160px;
    width: 100%;
    resize: none;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    font-size: 18px;
    line-height: 1.55;
  }
  #script::placeholder { color: var(--muted); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .meta .stats { color: var(--muted); font-size: 15px; }
  .meta .links { display: flex; gap: 6px; }
  .link {
    background: none; border: 0; padding: 8px 10px; border-radius: 8px;
    color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .start {
    height: 56px; width: 100%; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 19px; font-weight: 700; cursor: pointer;
  }
  .start:disabled { opacity: .4; cursor: not-allowed; }

  .cambox {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  }
  .cambox.ok { border-color: #3C8B6A; }
  .cambox.bad { border-color: #C5604A; }
  .cambox .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cambox strong { font-weight: 700; font-size: 16px; }
  .cambox .s { color: var(--muted); font-size: 14px; line-height: 1.4; }
  .cambox .acts { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .cambox .btn {
    min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer;
  }
  .cambox .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .cambox .btn:disabled { opacity: .5; }

  /* ---------- Prompter ---------- */
  .prompter {
    --p-bg: #0A101C;
    --p-panel: #141D2F;
    --p-ink: #F4F1E7;
    --p-muted: #8D9AB3;
    --p-cue: #8FA3C2;
    --p-accent: #F2B84B;
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    background: var(--p-bg); color: var(--p-ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    user-select: none; -webkit-user-select: none;
  }
  .prompter.on { display: flex; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px 6px; font-size: 14px; color: var(--p-muted);
    transition: opacity .35s;
  }
  .progress { height: 3px; background: #1E2940; transition: opacity .35s; }
  .progress i { display: block; height: 100%; width: 0; background: var(--p-accent); }

  .stage { flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
  .flip { position: absolute; inset: 0; }
  .flip.mirror { transform: scaleX(-1); }
  .track {
    position: absolute; left: 0; right: 0; top: 0;
    padding-left: clamp(18px, 6vw, 90px); padding-right: clamp(18px, 6vw, 90px);
    will-change: transform;
  }
  .text { max-width: 1100px; margin: 0 auto; }
  .text p {
    margin: 0 0 .4em; font-weight: 700; line-height: 1.4;
    overflow-wrap: break-word;
  }
  .text p.gap { height: .8em; margin: 0; }
  .cue { font-weight: 400; font-style: italic; font-size: .62em; color: var(--p-cue); }

  .read {
    position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
    background: rgba(10, 16, 28, .62);
  }
  .guide {
    position: absolute; left: 0; right: 0; pointer-events: none;
    background: rgba(242, 184, 75, .09);
    border-top: 1px solid rgba(242, 184, 75, .35);
    border-bottom: 1px solid rgba(242, 184, 75, .35);
  }
  .guide::before, .guide::after {
    content: ""; position: absolute; top: 50%; transform: translateY(-50%);
    border: 9px solid transparent;
  }
  .guide::before { left: 0; border-left: 12px solid var(--p-accent); border-right: 0; }
  .guide::after { right: 0; border-right: 12px solid var(--p-accent); border-left: 0; }
  .fade-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 18%; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,16,28,0), var(--p-bg));
  }
  .countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: min(40vw, 260px); font-weight: 700; color: var(--p-accent);
    background: rgba(10, 16, 28, .72);
  }
  .countdown[hidden] { display: none; }

  .dock { position: relative; transition: opacity .35s; }
  .prompter.idle .dock, .prompter.idle .topbar, .prompter.idle .progress { opacity: 0; pointer-events: none; }
  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 10px 12px; background: var(--p-panel);
  }
  .ib {
    width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent;
    color: var(--p-ink); display: grid; place-items: center; cursor: pointer; font-weight: 700; font-size: 17px;
  }
  .ib:hover { background: #1E2940; }
  .ib svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ib.play { width: 64px; height: 64px; border-radius: 50%; background: var(--p-accent); color: #1B1405; }
  .ib.play:hover { background: #F7C766; }
  .ib.play svg { width: 30px; height: 30px; fill: currentColor; stroke: none; }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 100%;
    background: var(--p-panel); border-top: 1px solid #243251;
    padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .sheet[hidden] { display: none; }
  .row { display: grid; grid-template-columns: 84px 1fr 62px; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; }
  .row output { text-align: right; color: var(--p-muted); font-size: 15px; }
  .row.check { grid-template-columns: 24px 1fr; }
  .row input[type="range"] { width: 100%; accent-color: var(--p-accent); }
  .row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--p-accent); }

  /* ---------- Camera + recording ---------- */
  .cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .cam[hidden] { display: none; }
  .cam.selfie { transform: scaleX(-1); }
  .camdim { position: absolute; inset: 0; pointer-events: none; background: #0A101C; opacity: .5; }
  .camdim[hidden] { display: none; }
  .stage.live .text p { text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9); }
  .stage.live .read { background: rgba(10, 16, 28, .3); }
  .stage.live .countdown { background: rgba(10, 16, 28, .35); }

  .ib[hidden] { display: none; }
  .ib.rec { color: #FF6B6B; }
  .ib.rec .dot { width: 18px; height: 18px; border-radius: 50%; background: currentColor; transition: border-radius .15s; }
  .ib.rec.on .dot { border-radius: 4px; }

  .sheet { max-height: 55vh; overflow-y: auto; }
  .row { grid-template-columns: 104px 1fr 56px; }
  .row.btnrow { grid-template-columns: 104px 1fr; }
  .note { margin: 2px 0 8px; font-size: 14px; color: var(--p-muted); }
  .note[hidden] { display: none; }
  .chip {
    min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #33466E;
    background: transparent; color: var(--p-ink); cursor: pointer; font-weight: 700;
  }
  .chip.solid { background: var(--p-accent); border-color: var(--p-accent); color: #1B1405; }
  .saved {
    position: absolute; z-index: 5; left: 12px; right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 44px);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: 14px; background: var(--p-panel);
    border: 1px solid #2B3A5C; font-size: 15px;
  }
  .saved[hidden] { display: none; }
  .saved .acts { display: flex; gap: 8px; }

  @media (max-width: 430px) {
    .controls { gap: 2px; padding: 10px 8px; }
    .ib { width: 42px; height: 42px; border-radius: 12px; }
    .ib.play { width: 58px; height: 58px; border-radius: 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dock, .topbar, .progress, .ib.rec .dot { transition: none; }
  }
</style>
</head>
<body>

<main class="editor" id="editor">
  <div>
    <h1>Cue</h1>
    <p class="sub">Paste your script and read it while you record.</p>
  </div>
  <textarea id="script" spellcheck="true" aria-label="Your script"
    placeholder="Paste your script here. Anything in [brackets] shows up dimmed, like [look at camera] or [pause]."></textarea>
  <div class="meta">
    <span class="stats" id="stats" aria-live="polite"></span>
    <span class="links">
      <button class="link" id="sample" type="button">Use sample</button>
      <button class="link" id="clear" type="button">Clear</button>
    </span>
  </div>
  <div class="cambox" id="camBox">
    <div class="txt"><strong id="camTitle">Use your camera</strong><span class="s" id="camSub"></span></div>
    <div class="acts">
      <button class="btn" id="camAllow" type="button">Allow camera</button>
      <button class="btn ghost" id="camOpen" type="button" hidden>Open full page</button>
    </div>
  </div>
  <button class="start" id="start" type="button">Start prompter</button>
</main>

<section class="prompter" id="prompter" aria-label="Teleprompter">
  <div class="topbar"><span id="state">Ready</span><span id="readout"></span></div>
  <div class="progress"><i id="bar"></i></div>

  <div class="stage" id="stage">
    <video class="cam" id="cam" autoplay muted playsinline hidden></video>
    <div class="camdim" id="camdim" hidden></div>
    <div class="flip" id="flip">
      <div class="track" id="track"><div class="text" id="text"></div></div>
      <div class="read" id="read"></div>
      <div class="guide" id="guide"></div>
      <div class="fade-bottom"></div>
      <div class="countdown" id="cd" hidden></div>
    </div>
  </div>

  <div class="saved" id="saved" hidden role="status">
    <span id="savedMsg"></span>
    <span class="acts">
      <button class="chip solid" id="saveBtn" type="button">Save video</button>
      <button class="chip" id="discardBtn" type="button">Discard</button>
    </span>
  </div>

  <div class="dock" id="dock">
    <div class="sheet" id="sheet" hidden>
      <label class="row check"><input type="checkbox" id="camOn"><span>Show camera behind the text</span></label>
      <label class="row"><span>Dimming</span><input type="range" id="dim" min="0" max="85" step="5"><output id="dimOut"></output></label>
      <div class="row btnrow"><span>Camera</span><button class="chip" id="flipCam" type="button">Switch front / rear</button></div>
      <label class="row"><span>Line position</span><input type="range" id="lead" min="12" max="60" step="2"><output id="leadOut"></output></label>
      <p class="note" id="camNote" hidden></p>
      <label class="row"><span>Speed</span><input type="range" id="wpm" min="40" max="320" step="5"><output id="wpmOut"></output></label>
      <label class="row"><span>Text size</span><input type="range" id="size" min="24" max="120" step="2"><output id="sizeOut"></output></label>
      <label class="row check"><input type="checkbox" id="mirror"><span>Mirror text (for teleprompter glass)</span></label>
      <label class="row check"><input type="checkbox" id="guideOn"><span>Highlight the reading line</span></label>
    </div>
    <div class="controls">
      <button class="ib" id="back" type="button" aria-label="Back to script">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="ib" id="restart" type="button" aria-label="Restart from the top">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>
      </button>
      <button class="ib" id="slower" type="button" aria-label="Slower">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="ib play" id="play" type="button" aria-label="Play"></button>
      <button class="ib" id="faster" type="button" aria-label="Faster">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>
      </button>
      <button class="ib rec" id="rec" type="button" aria-label="Record video"><span class="dot"></span></button>
      <button class="ib" id="settings" type="button" aria-label="Settings" aria-expanded="false">Aa</button>
    </div>
  </div>
</section>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  var SAMPLE = "[Look at the camera, smile]\n" +
    "Hey everyone, welcome back to the channel.\n\n" +
    "Today I'm showing you how to film a whole video without ever looking away from the lens.\n\n" +
    "[Pause, lean in]\n" +
    "Here's the trick: put your script right beside the camera and let it scroll at the pace you naturally talk.\n\n" +
    "Slow it down when you want to land a point. Speed it up when you're telling a story.\n\n" +
    "[Hold up your phone]\n" +
    "That's it. One take, no cue cards, and your eyes stay where your audience is.\n\n" +
    "If this helped, subscribe, and I'll see you in the next one.";

  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem("cue:" + k); return v === null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem("cue:" + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  var state = {
    script: store.get("script", ""),
    wpm: store.get("wpm", 150),
    size: store.get("size", 40),
    mirror: store.get("mirror", false),
    guide: store.get("guide", true),
    cam: store.get("cam", false),
    dim: store.get("dim", 50),
    lead: store.get("lead", 34),
    facing: store.get("facing", "user")
  };

  var editor = $("#editor"), prompter = $("#prompter"), scriptEl = $("#script"),
      stats = $("#stats"), startBtn = $("#start"),
      stage = $("#stage"), flip = $("#flip"), track = $("#track"), textEl = $("#text"),
      read = $("#read"), guide = $("#guide"), cd = $("#cd"),
      bar = $("#bar"), readout = $("#readout"), stateEl = $("#state"),
      playBtn = $("#play"), sheet = $("#sheet"), settingsBtn = $("#settings"),
      wpmIn = $("#wpm"), wpmOut = $("#wpmOut"), sizeIn = $("#size"), sizeOut = $("#sizeOut"),
      mirrorIn = $("#mirror"), guideIn = $("#guideOn"),
      cam = $("#cam"), camdim = $("#camdim"), camOnIn = $("#camOn"),
      dimIn = $("#dim"), dimOut = $("#dimOut"), leadIn = $("#lead"), leadOut = $("#leadOut"),
      flipCamBtn = $("#flipCam"), camNote = $("#camNote"), recBtn = $("#rec"),
      saved = $("#saved"), savedMsg = $("#savedMsg"), saveBtn = $("#saveBtn"), discardBtn = $("#discardBtn");

  var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

  function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function countWords(t) {
    var clean = t.replace(/\[[^\]]*\]/g, " ").trim();
    return clean ? clean.split(/\s+/).length : 0;
  }

  /* ---------- Editor ---------- */
  function updateStats() {
    var w = countWords(state.script);
    if (!w) {
      stats.textContent = "Paste or type your script to begin.";
      startBtn.disabled = true;
    } else {
      stats.textContent = w + " words \u00B7 " + fmt(w / state.wpm * 60) + " at " + state.wpm + " wpm";
      startBtn.disabled = false;
    }
  }
  scriptEl.value = state.script;
  scriptEl.addEventListener("input", function () {
    state.script = scriptEl.value;
    store.set("script", state.script);
    updateStats();
  });
  $("#sample").addEventListener("click", function () {
    scriptEl.value = state.script = SAMPLE;
    store.set("script", state.script);
    updateStats();
  });
  $("#clear").addEventListener("click", function () {
    scriptEl.value = state.script = "";
    store.set("script", "");
    updateStats();
    scriptEl.focus();
  });

  /* ---------- Prompter state ---------- */
  var pos = 0, textH = 0, pxPerWord = 1, words = 0;
  var playing = false, counting = false, raf = 0, last = 0, cdTimer = 0, idleTimer = 0, wl = null;

  function renderScript() {
    textEl.textContent = "";
    state.script.split("\n").forEach(function (line) {
      var p = document.createElement("p");
      if (!line.trim()) {
        p.className = "gap";
        p.textContent = "\u00A0";
      } else {
        line.split(/(\[[^\]]*\])/).forEach(function (part) {
          if (!part) return;
          if (/^\[[^\]]*\]$/.test(part)) {
            var s = document.createElement("span");
            s.className = "cue";
            s.textContent = part;
            p.appendChild(s);
          } else {
            p.appendChild(document.createTextNode(part));
          }
        });
      }
      textEl.appendChild(p);
    });
    words = countWords(state.script);
  }

  function layout() {
    var h = stage.clientHeight;
    var lead = Math.round(h * state.lead / 100);
    var lh = state.size * 1.4;
    track.style.fontSize = state.size + "px";
    track.style.paddingTop = lead + "px";
    track.style.paddingBottom = Math.round(h * 0.7) + "px";
    guide.style.top = lead + "px";
    guide.style.height = Math.round(lh) + "px";
    read.style.height = lead + "px";
    textH = textEl.offsetHeight;
    pxPerWord = textH / Math.max(words, 1);
    pos = clamp(pos, 0, textH);
    draw();
  }

  function relayout() {
    var ratio = textH ? pos / textH : 0;
    layout();
    pos = ratio * textH;
    draw();
  }

  function pxPerSec() { return state.wpm / 60 * pxPerWord; }

  function draw() {
    track.style.transform = "translate3d(0," + (-pos) + "px,0)";
    bar.style.width = (textH ? pos / textH * 100 : 0) + "%";
    var done = textH && pos >= textH - 0.5;
    var left = done ? 0 : (textH - pos) / pxPerSec();
    readout.textContent = state.wpm + " wpm \u00B7 " + (done ? "end of script" : fmt(left) + " left");
    var s = counting ? "Starting\u2026" : playing ? "Reading" : (done ? "Finished" : "Paused");
    if (recording) s = "\u25CF REC " + fmt((Date.now() - recStart) / 1000) + " \u00B7 " + s;
    stateEl.textContent = s;
  }

  function tick(t) {
    if (!playing) return;
    var dt = Math.min(Math.max((t - last) / 1000, 0), 0.1);
    last = t;
    pos += pxPerSec() * dt;
    if (pos >= textH) { pos = textH; setPlaying(false); return; }
    draw();
    raf = requestAnimationFrame(tick);
  }

  function setPlaying(v) {
    playing = v;
    cancelAnimationFrame(raf);
    if (v) { last = performance.now(); raf = requestAnimationFrame(tick); }
    syncPlayIcon();
    draw();
    poke();
  }

  function syncPlayIcon() {
    var active = playing || counting;
    playBtn.innerHTML = active ? PAUSE : PLAY;
    playBtn.setAttribute("aria-label", active ? "Pause" : "Play");
  }

  function startCountdown() {
    var n = 3;
    counting = true;
    cd.textContent = n;
    cd.hidden = false;
    syncPlayIcon();
    draw();
    clearInterval(cdTimer);
    cdTimer = setInterval(function () {
      n--;
      if (n <= 0) {
        cancelCountdown();
        setPlaying(true);
      } else {
        cd.textContent = n;
      }
    }, 1000);
    poke();
  }

  function cancelCountdown() {
    clearInterval(cdTimer);
    counting = false;
    cd.hidden = true;
    syncPlayIcon();
    draw();
  }

  function togglePlay() {
    if (counting) { cancelCountdown(); poke(); return; }
    if (playing) { setPlaying(false); return; }
    if (pos >= textH - 1) pos = 0;
    if (pos === 0) startCountdown(); else setPlaying(true);
  }

  function poke() {
    prompter.classList.remove("idle");
    clearTimeout(idleTimer);
    if ((playing || counting) && sheet.hidden) {
      idleTimer = setTimeout(function () { prompter.classList.add("idle"); }, 2500);
    }
  }

  /* ---------- Settings ---------- */
  function syncSettings() {
    wpmIn.value = state.wpm; wpmOut.textContent = state.wpm + " wpm";
    sizeIn.value = state.size; sizeOut.textContent = state.size + " px";
    mirrorIn.checked = state.mirror;
    guideIn.checked = state.guide;
    flip.classList.toggle("mirror", state.mirror);
    guide.hidden = read.hidden = !state.guide;
    camOnIn.checked = state.cam;
    dimIn.value = state.dim; dimOut.textContent = state.dim + "%";
    leadIn.value = state.lead; leadOut.textContent = state.lead + "%";
    camdim.style.opacity = state.dim / 100;
  }
  function setSpeed(v) {
    state.wpm = clamp(Math.round(v / 5) * 5, 40, 320);
    store.set("wpm", state.wpm);
    syncSettings(); draw(); updateStats(); poke();
  }
  wpmIn.addEventListener("input", function () { setSpeed(+wpmIn.value); });
  sizeIn.addEventListener("input", function () {
    state.size = +sizeIn.value;
    store.set("size", state.size);
    syncSettings(); relayout();
  });
  mirrorIn.addEventListener("change", function () { state.mirror = mirrorIn.checked; store.set("mirror", state.mirror); syncSettings(); });
  guideIn.addEventListener("change", function () { state.guide = guideIn.checked; store.set("guide", state.guide); syncSettings(); });

  settingsBtn.addEventListener("click", function () {
    sheet.hidden = !sheet.hidden;
    settingsBtn.setAttribute("aria-expanded", String(!sheet.hidden));
    poke();
  });
  $("#slower").addEventListener("click", function () { setSpeed(state.wpm - 10); });
  $("#faster").addEventListener("click", function () { setSpeed(state.wpm + 10); });
  playBtn.addEventListener("click", togglePlay);
  $("#restart").addEventListener("click", function () {
    var wasPlaying = playing;
    cancelCountdown(); setPlaying(false);
    pos = 0; draw();
    if (wasPlaying) startCountdown();
  });
  $("#back").addEventListener("click", closePrompter);

  /* ---------- Stage gestures ---------- */
  var drag = null;
  stage.addEventListener("pointerdown", function (e) {
    drag = { y: e.clientY, pos: pos, moved: false, was: playing };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    poke();
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dy) > 8) {
      drag.moved = true;
      if (counting) cancelCountdown();
      if (playing) setPlaying(false);
    }
    if (drag.moved) { pos = clamp(drag.pos - dy, 0, textH); draw(); }
  });
  stage.addEventListener("pointerup", function () {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.moved) { togglePlay(); }
    else if (d.was) { setPlaying(true); }
  });
  stage.addEventListener("pointercancel", function () { drag = null; });
  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    pos = clamp(pos + e.deltaY, 0, textH);
    draw(); poke();
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (!prompter.classList.contains("on")) return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSpeed(state.wpm + 10); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setSpeed(state.wpm - 10); }
    else if (e.key === "Escape") { closePrompter(); }
    else if (e.key === "Home") { pos = 0; draw(); }
  });

  /* ---------- Camera and recording ---------- */
  var stream = null, recorder = null, chunks = [], recStart = 0, recTimer = 0;
  var recording = false, pending = null, toastTimer = 0;

  function showToast(msg, actions) {
    clearTimeout(toastTimer);
    savedMsg.textContent = msg;
    saveBtn.hidden = discardBtn.hidden = !actions;
    saved.hidden = false;
    if (!actions) toastTimer = setTimeout(function () { saved.hidden = true; }, 5000);
  }
  function hideSaved() {
    clearTimeout(toastTimer);
    saved.hidden = true;
    pending = null;
  }
  function note(msg) {
    camNote.textContent = msg || "";
    camNote.hidden = !msg;
    if (msg && !pending) showToast(msg, false);
  }

  function stopStream() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
    cam.srcObject = null;
  }
  function showCam(on) {
    cam.hidden = !on;
    camdim.hidden = !on;
    stage.classList.toggle("live", on);
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      note("This browser can't open the camera here.");
      return false;
    }
    stopStream();
    var portrait = window.innerHeight > window.innerWidth;
    var video = {
      facingMode: { ideal: state.facing },
      width: { ideal: portrait ? 1080 : 1920 },
      height: { ideal: portrait ? 1920 : 1080 }
    };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
      note("");
    } catch (e1) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: video, audio: false });
        note("No microphone access, so recordings will have no sound.");
      } catch (e2) {
        stream = null;
        camErr = (e2 && e2.name) || "Error";
        note(e2 && e2.name === "NotAllowedError"
          ? "Camera blocked. Allow camera access for this page, or open the page directly in your browser."
          : "Couldn't start the camera.");
        return false;
      }
    }
    camErr = "";
    permState = "granted";
    cam.srcObject = stream;
    try { await cam.play(); } catch (e) {}
    showCam(true);
    var fm = stream.getVideoTracks()[0].getSettings().facingMode;
    cam.classList.toggle("selfie", fm ? fm === "user" : state.facing === "user");
    return true;
  }

  async function setCamera(on) {
    if (on) {
      var ok = await startCamera();
      state.cam = ok;
      if (!ok) showCam(false);
    } else {
      if (recording) stopRecording();
      stopStream();
      showCam(false);
      note("");
      state.cam = false;
    }
    store.set("cam", state.cam);
    syncSettings();
    renderCamBox();
    return !!stream;
  }

  function pickType() {
    var types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
    for (var i = 0; i < types.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i];
    }
    return "";
  }

  function startRecording() {
    if (!stream || !window.MediaRecorder) { note("Recording isn't supported in this browser."); return; }
    hideSaved();
    chunks = [];
    var type = pickType();
    try { recorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream); }
    catch (e) { note("Couldn't start recording."); return; }
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      var mime = recorder.mimeType || type || "video/webm";
      var blob = new Blob(chunks, { type: mime });
      var secs = (Date.now() - recStart) / 1000;
      pending = { blob: blob, ext: /mp4/.test(mime) ? "mp4" : "webm" };
      showToast("Recording ready \u00B7 " + fmt(secs), true);
    };
    recorder.start(1000);
    recording = true;
    recStart = Date.now();
    recTimer = setInterval(draw, 1000);
    syncRecBtn();
    if (!playing && !counting) togglePlay();
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    clearInterval(recTimer);
    try { recorder.stop(); } catch (e) {}
    syncRecBtn();
    draw();
  }

  function syncRecBtn() {
    recBtn.classList.toggle("on", recording);
    recBtn.setAttribute("aria-label", recording ? "Stop recording" : "Record video");
    recBtn.hidden = !window.MediaRecorder;
  }

  function stamp() { return new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-"); }

  recBtn.addEventListener("click", async function () {
    if (recording) { stopRecording(); return; }
    if (!stream && !(await setCamera(true))) return;
    startRecording();
  });

  saveBtn.addEventListener("click", async function () {
    if (!pending) return;
    var name = "cue-take-" + stamp() + "." + pending.ext;
    var dl = null;
    try { dl = window.claude ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try {
        await dl.save({ filename: name, data: pending.blob });
        hideSaved();
      } catch (e) {
        if (!e || e.code !== "declined") showToast("Couldn't save the video. Try again?", true);
      }
    } else {
      try {
        var url = URL.createObjectURL(pending.blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        hideSaved();
      } catch (e) {
        showToast("Saving isn't available here.", true);
      }
    }
  });
  discardBtn.addEventListener("click", hideSaved);

  camOnIn.addEventListener("change", function () { setCamera(camOnIn.checked); });
  dimIn.addEventListener("input", function () {
    state.dim = +dimIn.value; store.set("dim", state.dim); syncSettings();
  });
  leadIn.addEventListener("input", function () {
    state.lead = +leadIn.value; store.set("lead", state.lead); syncSettings(); layout();
  });
  flipCamBtn.addEventListener("click", function () {
    if (recording) { showToast("Stop recording before switching cameras.", false); return; }
    state.facing = state.facing === "user" ? "environment" : "user";
    store.set("facing", state.facing);
    if (state.cam) startCamera();
  });

  /* ---------- Camera permission card ---------- */
  var camBox = $("#camBox"), camTitle = $("#camTitle"), camSub = $("#camSub"),
      camAllow = $("#camAllow"), camOpen = $("#camOpen");
  var permState = "prompt", camErr = "", embedded = false;
  try { embedded = window.top !== window.self; } catch (e) { embedded = true; }
  var supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;
  var canOpen = embedded && /^https?:/.test(location.href);

  function renderCamBox() {
    var cls = "cambox", t, sub, label = "Allow camera", showOpen = false;
    if (!supported) {
      cls += " bad"; t = "Camera unavailable";
      sub = "This browser or connection can't use the camera. Open the app over HTTPS in Chrome or Safari.";
      label = "";
    } else if (camErr === "NotFoundError") {
      cls += " bad"; t = "No camera found";
      sub = "Enable or connect a camera, then try again.";
      label = "Try again";
    } else if (camErr === "NotReadableError") {
      cls += " bad"; t = "Camera in use";
      sub = "Close other apps that are using the camera, then try again.";
      label = "Try again";
    } else if (permState === "denied" || camErr === "NotAllowedError" || camErr === "SecurityError") {
      cls += " bad"; t = "Camera blocked";
      sub = embedded
        ? "No permission prompt? This preview blocks the camera. Open the full page, then allow it."
        : "Tap the lock icon by the address bar, set Camera and Microphone to Allow, then try again.";
      label = "Try again"; showOpen = canOpen;
    } else if (permState === "granted" && state.cam) {
      cls += " ok"; t = "Camera on";
      sub = "It shows behind your script. Use the red button in the prompter to record.";
      label = "Turn off";
    } else if (permState === "granted") {
      t = "Camera off"; sub = "Turn it on to read over your own video."; label = "Turn on";
    } else {
      t = "Use your camera";
      sub = "Allow camera and microphone to read over your own video and record takes.";
    }
    camBox.className = cls;
    camTitle.textContent = t;
    camSub.textContent = sub;
    camAllow.hidden = !label;
    camAllow.textContent = label;
    camOpen.hidden = !showOpen;
  }

  async function requestPermission() {
    camErr = "";
    var s = null;
    try {
      s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (e1) {
      if (e1 && (e1.name === "NotFoundError" || e1.name === "NotReadableError")) {
        camErr = e1.name;
      } else {
        try { s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
        catch (e2) { camErr = (e2 && e2.name) || "Error"; }
      }
    }
    if (s) {
      s.getTracks().forEach(function (t) { t.stop(); });
      permState = "granted";
      state.cam = true;
      store.set("cam", true);
      syncSettings();
    }
    renderCamBox();
  }

  camAllow.addEventListener("click", async function () {
    if (permState === "granted" && state.cam && !camErr) {
      state.cam = false; store.set("cam", false); syncSettings(); renderCamBox();
    } else if (permState === "granted" && !camErr) {
      state.cam = true; store.set("cam", true); syncSettings(); renderCamBox();
    } else {
      camAllow.disabled = true;
      await requestPermission();
      camAllow.disabled = false;
    }
  });
  camOpen.addEventListener("click", function () { window.open(location.href, "_blank", "noopener"); });

  async function initPerm() {
    try {
      var p = await navigator.permissions.query({ name: "camera" });
      permState = p.state;
      p.onchange = function () {
        permState = p.state;
        if (p.state === "granted") camErr = "";
        renderCamBox();
      };
    } catch (e) {}
    renderCamBox();
  }

  /* ---------- Open / close ---------- */
  function lock() {
    try {
      if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen").then(function (l) { wl = l; }).catch(function () {});
      }
    } catch (e) {}
  }
  function unlock() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && prompter.classList.contains("on")) lock();
  });

  function openPrompter() {
    if (!countWords(state.script)) return;
    pos = 0;
    renderScript();
    editor.hidden = true;
    prompter.classList.add("on");
    syncSettings();
    sheet.hidden = true;
    settingsBtn.setAttribute("aria-expanded", "false");
    syncPlayIcon();
    layout();
    lock();
    poke();
    if (state.cam) setCamera(true); else showCam(false);
  }
  function closePrompter() {
    if (recording) { showToast("Stop recording before you leave.", false); return; }
    if (pending) { showToast("Save or discard your video first.", true); return; }
    cancelCountdown();
    setPlaying(false);
    unlock();
    stopStream();
    showCam(false);
    saved.hidden = true;
    prompter.classList.remove("on", "idle");
    editor.hidden = false;
  }
  startBtn.addEventListener("click", openPrompter);

  window.addEventListener("resize", function () { if (prompter.classList.contains("on")) relayout(); });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (prompter.classList.contains("on")) relayout(); });
  }

  syncSettings();
  syncRecBtn();
  updateStats();
  initPerm();
})();
</script>
